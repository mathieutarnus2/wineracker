<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Wineracker · Back-office</title>
<link rel="icon" href="img/symbole.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f4f1ea; --surface: #fffdf8; --ink: #1d1a17; --muted: #6b645c; --line: #e2dbcf; --soft: #f0ebe1;
  --accent: #701520; --accent-ink: #fff8f0; --gold: #c98a24; --ok: #2f6b45; --warn: #a3541a; --bad: #a8242f;
  --display: "Gloock", Georgia, serif; --body: "Hanken Grotesk", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14110f; --surface: #1d1916; --ink: #efe8de; --muted: #a59c90; --line: #352e28; --soft: #26201c;
  --accent: #d9667a; --accent-ink: #2a0a10; --gold: #e0a849; --ok: #7cc495; --warn: #e3a066; --bad: #ef7d86; color-scheme: dark;
} }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased }
button, input, select { font: inherit; color: inherit }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px }
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px }
header.top img { width: 36px; height: 36px }
header.top h1 { font: 400 1.6rem/1 var(--display); margin: 0; letter-spacing: .01em }
header.top h1 span { color: var(--muted); font-size: 1rem; font-family: var(--body); margin-left: 6px }
header.top .moi { margin-left: auto; color: var(--muted); font-size: .88rem; display: flex; gap: 10px; align-items: center }
a.btn { text-decoration: none; color: inherit; display: inline-block }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; cursor: pointer }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--bad) }
.btn.small { padding: 4px 10px; font-size: .85rem }
.btn:disabled { opacity: .5; cursor: default }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px }
.kpi b { display: block; font: 400 1.7rem/1.1 var(--display); font-variant-numeric: tabular-nums }
.kpi span { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600 }
.kpi small { color: var(--muted); display: block; font-size: .8rem }
.outils { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px }
.outils input[type=search] { flex: 1 1 240px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
.outils select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
.outils .nb { color: var(--muted); font-size: .88rem; margin-left: auto }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle }
th { font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; background: var(--soft) }
th.tri::after { content: " ↓" } th.tri.asc::after { content: " ↑" }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums }
tbody tr { cursor: pointer } tbody tr:hover { background: var(--soft) }
tbody tr:last-child td { border-bottom: 0 }
.qui b { display: block; font-weight: 600 } .qui small { color: var(--muted) }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; border: 1px solid currentColor; white-space: nowrap }
.b-paye { color: var(--ok) } .b-offert { color: var(--gold) } .b-gratuit { color: var(--muted) } .b-alerte { color: var(--warn) } .b-susp { color: var(--bad) }
.vide { padding: 40px; text-align: center; color: var(--muted) }
@media (max-width: 760px) {
  table, thead, tbody, tr, td { display: block } thead { display: none }
  tbody tr { border-bottom: 1px solid var(--line); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px }
  td { border: 0; padding: 0 } td.qui { grid-column: 1 / -1 } td.n { text-align: left; color: var(--muted); font-size: .85rem }
  td[data-l]::before { content: attr(data-l) " : " }
}
/* connexion */
.login { min-height: 100dvh; display: grid; place-items: center; padding: 20px }
.login .carte { width: 100%; max-width: 22rem; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 12px }
.login img { width: 54px; height: 54px }
.login h1 { font: 400 1.5rem/1.1 var(--display); margin: 0 }
.login input { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg) }
.err { color: var(--bad); font-size: .9rem; margin: 0 }
.meta { color: var(--muted); font-size: .88rem; margin: 0 }
/* fiche */
dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 40px) }
dialog::backdrop { background: rgb(0 0 0 / .45) }
.fiche { padding: 20px 22px 18px; display: flex; flex-direction: column; gap: 16px }
.fiche h2 { font: 400 1.4rem/1.15 var(--display); margin: 0; word-break: break-word }
.fiche h3 { margin: 0 0 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted) }
.grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px 16px }
.grille div span { display: block; color: var(--muted); font-size: .8rem } .grille div b { font-weight: 600 }
.bloc { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--bg) }
.ligne { display: flex; gap: 8px; flex-wrap: wrap; align-items: end }
.ligne label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); font-weight: 600 }
.ligne select, .ligne input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 120px; color: var(--ink); font-weight: 400 }
.ligne input.note { min-width: 220px; flex: 1 }
.lien { display: flex; gap: 6px } .lien input { flex: 1; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: .8rem }
.pied { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 10 }
.spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: t 1s linear infinite; margin: 60px auto }
@keyframes t { to { transform: rotate(360deg) } }
</style>
</head>
<body>
<main class="login" id="login" hidden>
  <form class="carte" id="lForm">
    <img src="img/symbole.svg" alt="">
    <h1>Back-office Wineracker</h1>
    <p class="meta">Réservé à l'équipe. Connectez-vous avec le compte administrateur.</p>
    <button type="button" class="btn" id="lGoogle">Continuer avec Google</button>
    <input type="email" id="lMail" placeholder="E-mail" autocomplete="email" required>
    <input type="password" id="lMdp" placeholder="Mot de passe" autocomplete="current-password" required>
    <p class="err" id="lErr" hidden></p>
    <button class="btn primary">Se connecter</button>
  </form>
</main>

<div class="wrap" id="bo" hidden>
  <header class="top">
    <img src="img/symbole.svg" alt="">
    <h1>Wineracker<span>Back-office</span></h1>
    <div class="moi"><span id="moi"></span><button class="btn small" id="rafraichir">Actualiser</button><button class="btn small" id="sortir">Se déconnecter</button></div>
  </header>
  <section class="kpis" id="kpis"></section>
  <div class="outils">
    <input type="search" id="q" placeholder="Chercher un e-mail, un nom, un pays…">
    <select id="filtre">
      <option value="">Tous les comptes</option>
      <option value="paye">Abonnés payants</option>
      <option value="offert">Accès offerts</option>
      <option value="gratuit">Version gratuite</option>
      <option value="limite">Gratuits à la limite (50 bouteilles et plus)</option>
      <option value="nouveaux">Inscrits depuis 7 jours</option>
      <option value="nouvelles">Acceptent les nouvelles par e-mail</option>
      <option value="susp">Suspendus</option>
    </select>
    <button class="btn small" id="csv">Exporter (CSV)</button>
    <span class="nb" id="nb"></span>
  </div>
  <div id="liste"><div class="spin"></div></div>
</div>
<dialog id="dlg"><div class="fiche" id="fiche"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
